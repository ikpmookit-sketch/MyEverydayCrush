<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine?</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #ffafbd, #ffc3a0);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        h1 {
            color: #d43f5d;
            font-size: 2.8rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #8a2b42;
            font-size: 1.2rem;
            font-style: italic;
        }
        
        .envelope-container {
            position: relative;
            width: 500px;
            max-width: 90%;
            perspective: 1000px;
            margin-bottom: 40px;
        }
        
        .envelope {
            background-color: #fff9f9;
            border-radius: 10px;
            padding: 50px 40px;
            box-shadow: 0 15px 35px rgba(212, 63, 93, 0.3);
            text-align: center;
            border: 2px solid #ff6b93;
            position: relative;
            z-index: 2;
            transform-style: preserve-3d;
            transition: transform 0.5s;
        }
        
        .envelope:hover {
            transform: translateY(-5px);
        }
        
        .envelope:before {
            content: '';
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 20px;
            background-color: #ff6b93;
            border-radius: 5px 5px 0 0;
            z-index: 1;
        }
        
        .envelope:after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, transparent 30%, rgba(255, 255, 255, 0.3) 50%, transparent 70%);
            border-radius: 10px;
            z-index: 1;
            pointer-events: none;
        }
        
        .question {
            font-size: 2.2rem;
            color: #d43f5d;
            margin-bottom: 40px;
            line-height: 1.3;
            font-weight: 600;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
        }
        
        .name {
            color: #ff4081;
            font-weight: 700;
            text-decoration: underline;
        }
        
        .buttons {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 20px;
            position: relative;
            z-index: 10;
        }
        
        .btn {
            padding: 15px 40px;
            font-size: 1.5rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .yes-btn {
            background-color: #4CAF50;
            color: white;
        }
        
        .yes-btn:hover {
            background-color: #45a049;
            transform: scale(1.05);
        }
        
        .no-btn {
            background-color: #f44336;
            color: white;
            position: relative;
        }
        
        .no-btn:hover {
            background-color: #d32f2f;
        }
        
        .floating {
            position: absolute;
            transition: all 0.5s ease;
            z-index: 1;
        }
        
        .heart {
            position: absolute;
            color: #ff4081;
            font-size: 1.5rem;
            opacity: 0;
            z-index: 1;
            pointer-events: none;
        }
        
        .footer {
            margin-top: 30px;
            text-align: center;
            color: #8a2b42;
            font-size: 1rem;
            max-width: 600px;
            line-height: 1.5;
        }
        
        .response {
            margin-top: 30px;
            font-size: 2rem;
            color: #d43f5d;
            font-weight: 700;
            text-align: center;
            min-height: 60px;
            opacity: 0;
            transition: opacity 0.5s;
        }
        
        .show {
            opacity: 1;
        }
        
        @keyframes float {
            0% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(100px, -80px) rotate(20deg); }
            50% { transform: translate(-80px, 60px) rotate(-20deg); }
            75% { transform: translate(120px, 40px) rotate(15deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }
        
        @keyframes heartFloat {
            0% { transform: translateY(0) scale(0); opacity: 0; }
            10% { opacity: 1; }
            100% { transform: translateY(-100px) scale(1.5); opacity: 0; }
        }
        
        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            .question { font-size: 1.8rem; }
            .envelope-container { width: 95%; }
            .buttons { flex-direction: column; align-items: center; gap: 20px; }
            .btn { width: 200px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1><i class="fas fa-heart"></i> Valentine's Day Proposal <i class="fas fa-heart"></i></h1>
        <p class="subtitle">A special question for a special person</p>
    </div>
    
    <div class="envelope-container">
        <div class="envelope">
            <div class="question">Asa, will you be my Valentine?</div>
            <div class="buttons">
                <button class="btn yes-btn" id="yesBtn">Yes!</button>
                <button class="btn no-btn" id="noBtn">No</button>
            </div>
        </div>
    </div>
    
    <div class="response" id="response"></div>
    
    <div class="footer">
        <p><i class="fas fa-heartbeat"></i> Made with love for Asa. No matter what you choose, you're always special! <i class="fas fa-heartbeat"></i></p>
        <p style="margin-top: 10px; font-size: 2.9rem;">❤️</p>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const yesBtn = document.getElementById('yesBtn');
            const noBtn = document.getElementById('noBtn');
            const response = document.getElementById('response');
            const envelope = document.querySelector('.envelope');
            const body = document.body;
            
            // Track how many times the No button has been hovered/clicked
            let noHoverCount = 0;
            
            // When Yes is clicked
            yesBtn.addEventListener('click', function() {
                response.textContent = "Yay! ❤️ You've made me the happiest person! Happy Valentine's Day!";
                response.classList.add('show');
                
                // Create floating hearts animation
                createHearts(30);
                
                // Change background to celebration mode
                body.style.background = "linear-gradient(135deg, #ffafbd, #ffc3a0, #a1ffce, #faffd1)";
                
                // Make envelope pulse with happiness
                envelope.style.animation = "pulse 1s infinite alternate";
            });
            
            // When No is clicked or hovered
            noBtn.addEventListener('mouseenter', function(e) {
                noHoverCount++;
                
                // Calculate a new random position for the button
                const container = document.querySelector('.envelope-container');
                const containerRect = container.getBoundingClientRect();
                const buttonRect = noBtn.getBoundingClientRect();
                
                // The more attempts, the more extreme the movement
                const movementFactor = Math.min(noHoverCount * 20, 150);
                
                // Generate random positions within envelope bounds
                const maxX = containerRect.width - buttonRect.width - 40;
                const maxY = containerRect.height - buttonRect.height - 40;
                
                let randomX, randomY;
                
                // For the first few attempts, make it easier to catch
                if (noHoverCount <= 3) {
                    randomX = Math.random() * (maxX * 0.5);
                    randomY = Math.random() * (maxY * 0.5);
                } else {
                    // Make it progressively harder
                    randomX = Math.random() * maxX;
                    randomY = Math.random() * maxY;
                }
                
                // Ensure the button doesn't go off-screen on mobile
                if (window.innerWidth < 600) {
                    randomX = Math.min(randomX, window.innerWidth - buttonRect.width - 20);
                    randomY = Math.min(randomY, window.innerHeight - buttonRect.height - 20);
                }
                
                // Apply the new position
                noBtn.style.position = 'absolute';
                noBtn.style.left = `${randomX}px`;
                noBtn.style.top = `${randomY}px`;
                
                // Add floating animation
                noBtn.style.animation = `float 0.5s ease`;
                
                // Change button text occasionally
                if (noHoverCount === 2) {
                    noBtn.textContent = "Are you sure?";
                } else if (noHoverCount === 4) {
                    noBtn.textContent = "Think again!";
                } else if (noHoverCount === 6) {
                    noBtn.textContent = "No";
                } else if (noHoverCount === 8) {
                    noBtn.textContent = "No";
                } else if (noHoverCount >= 10) {
                    noBtn.textContent = "No";
                }
                
                // Create a few hearts when button moves
                if (noHoverCount > 1) {
                    createHearts(3);
                }
                
                // Remove animation after it completes
                setTimeout(() => {
                    noBtn.style.animation = '';
                }, 500);
            });
            
            // When No is clicked (in case they manage to catch it)
            noBtn.addEventListener('click', function() {
                if (noHoverCount < 5) {
                    response.textContent = "Oh no! Please reconsider... 🥺";
                } else {
                    response.textContent = "You're persistent! But my heart still hopes... ❤️";
                }
                response.classList.add('show');
                
                // Create sad hearts
                createHearts(5, true);
                
                // Reset after 3 seconds
                setTimeout(() => {
                    response.classList.remove('show');
                }, 3000);
            });
            
            // Function to create floating hearts
            function createHearts(count, isSad = false) {
                for (let i = 0; i < count; i++) {
                    const heart = document.createElement('div');
                    heart.classList.add('heart');
                    heart.innerHTML = isSad ? '💔' : '❤️';
                    
                    // Random position
                    const startX = Math.random() * window.innerWidth;
                    heart.style.left = `${startX}px`;
                    heart.style.bottom = '0';
                    
                    // Random size
                    const size = Math.random() * 30 + 20;
                    heart.style.fontSize = `${size}px`;
                    
                    // Random animation delay
                    const delay = Math.random() * 1;
                    heart.style.animationDelay = `${delay}s`;
                    
                    // Random animation duration
                    const duration = Math.random() * 2 + 2;
                    heart.style.animation = `heartFloat ${duration}s ease-in forwards`;
                    
                    document.body.appendChild(heart);
                    
                    // Remove heart after animation completes
                    setTimeout(() => {
                        heart.remove();
                    }, (duration + delay) * 1000);
                }
            }
            
            // Add some initial decorative hearts
            for (let i = 0; i < 15; i++) {
                const heart = document.createElement('div');
                heart.classList.add('heart');
                heart.innerHTML = '❤️';
                
                // Random position
                const startX = Math.random() * window.innerWidth;
                const startY = Math.random() * window.innerHeight;
                heart.style.left = `${startX}px`;
                heart.style.top = `${startY}px`;
                
                // Random size
                const size = Math.random() * 20 + 10;
                heart.style.fontSize = `${size}px`;
                
                // Random opacity
                heart.style.opacity = '0.3';
                
                document.body.appendChild(heart);
            }
        });
    </script>
</body>
</html>
